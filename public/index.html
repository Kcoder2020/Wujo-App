<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#014023">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wujo">
    <meta name="application-name" content="Wujo App">
    <meta name="msapplication-TileColor" content="#014023">
    <meta name="msapplication-TileImage" content="/img/icons/icon-144x144.png">
    
    <!-- Favicon and Icons -->
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/icon-16x16.png">
    <link rel="apple-touch-icon" href="/img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/icon-180x180.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:site_name" content="Wujo App" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="D Iqub Financial Services & Trading P.L.C." />
    <meta property="og:url" content="https://wujo.app" />
    <meta property="og:description" content="Wujo App provides an alternate financial tool in addition with a multi-service ecommerce platform for the low- and medium-income earners" />
    <meta property="og:image" content="/img/icons/icon-512x512.png" />
    
    <title>Wujo App</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
